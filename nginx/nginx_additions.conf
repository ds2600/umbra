# ── Paste this INSIDE the http {} block in /etc/nginx/nginx.conf ─────────────
# Internal RTMP stat endpoint — port 8088, loopback only
# Do NOT use 8080 — that's the Umbra UI
server {
    listen 8088;
    server_name 127.0.0.1;
    location /stat {
        rtmp_stat all;
        allow 127.0.0.1;
        deny  all;
    }
}

# ── Paste this AFTER the closing } of the http {} block ──────────────────────
rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      on_publish http://127.0.0.1:8080/api/auth_stream.php;
      include /var/lib/umbra/rtmp_pushes.conf;
    }
  }
}
