# ── Add BEFORE the events {} block ───────────────────────────────────────────
load_module modules/ngx_rtmp_module.so;


# ── Add INSIDE the http {} block (before its closing }) ──────────────────────
server {
    listen 8088;
    server_name 127.0.0.1;
    location /stat {
        rtmp_stat all;
        allow 127.0.0.1;
        deny  all;
    }
}


# ── Add AFTER the closing } of the http {} block ─────────────────────────────
rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      on_publish http://127.0.0.1:8080/api/auth_stream.php;
      include /var/lib/umbra/rtmp_pushes.conf;
    }
  }
}
