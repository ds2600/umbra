# /etc/nginx/sites-available/umbra
# Umbra stream control panel — port 8080

server {
    listen 8080;
    server_name _;

    # nginx root points directly at web/ — no php outside this directory is served
    root /var/www/umbra/web;
    index index.php;

    # ── IP allowlist (strongly recommended) ──────────────────
    # allow 203.0.113.42;
    # deny  all;

    # ── Optional HTTP basic auth ──────────────────────────────
    # auth_basic           "Umbra";
    # auth_basic_user_file /etc/nginx/.umbra_htpasswd;

    # ── auth_stream.php: loopback only (called by nginx RTMP) ─
    location = /api/auth_stream.php {
        allow 127.0.0.1;
        deny  all;
        include         snippets/fastcgi-php.conf;
        fastcgi_pass    unix:/run/php/php8.1-fpm.sock;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include         fastcgi_params;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        include         snippets/fastcgi-php.conf;
        fastcgi_pass    unix:/run/php/php8.1-fpm.sock;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include         fastcgi_params;
    }

    # ── Block access to data/ (lives outside web root anyway) ─
    location ~ ^/data/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
