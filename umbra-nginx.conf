# /etc/nginx/sites-available/umbra
# Umbra stream control panel — port 8080

server {
    listen 8080;
    server_name _;

    root /var/www/umbra;
    index index.php;

    # ── IP allowlist ──────────────────────────────────────────
    # Uncomment and set your IP(s) before going to production.
    # allow 203.0.113.42;
    # deny  all;

    # ── Optional: HTTP basic auth (second layer) ──────────────
    # auth_basic           "Umbra";
    # auth_basic_user_file /etc/nginx/.umbra_htpasswd;

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        include         snippets/fastcgi-php.conf;
        fastcgi_pass    unix:/run/php/php8.1-fpm.sock;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include         fastcgi_params;
    }

    # ── auth_stream.php: allow from 127.0.0.1 only ───────────
    # nginx RTMP calls this internally via on_publish.
    # External access is blocked here; the Umbra dashboard
    # calls it through the normal PHP session path (same host).
    location = /api/auth_stream.php {
        allow 127.0.0.1;
        deny  all;
        include         snippets/fastcgi-php.conf;
        fastcgi_pass    unix:/run/php/php8.1-fpm.sock;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include         fastcgi_params;
    }

    # ── Block direct web access to data/ ─────────────────────
    location ~ ^/data/ {
        deny all;
    }

    # ── RTMP stat endpoint (loopback only) ───────────────────
    location /stat {
        rtmp_stat all;
        allow 127.0.0.1;
        deny  all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
